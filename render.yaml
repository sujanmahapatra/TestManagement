# Render Blueprint: one web service that builds the web app and serves it
# from the API, so the whole tool lives on one https address.
#
# Render dashboard -> New -> Blueprint -> pick this repository. It asks for
# the values marked `sync: false` (secrets are never stored in this file).
services:
  - type: web
    name: test-management
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production below makes npm skip devDependencies,
    # and the web build needs Vite, which is one.
    buildCommand: cd web && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && node src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DESTINATIONS
        value: excel,jira
      # Jira: filing test cases and linking them to their stories. Until the
      # two sign-in values below are entered, Jira stays paused and the Jira
      # badge in the app says what is missing.
      - key: JIRA_BASE_URL
        value: https://sujanmahapatro.atlassian.net
      - key: JIRA_PROJECT_KEY
        value: SCRUM
      - key: JIRA_ISSUE_TYPE
        value: Task
      - key: ATLASSIAN_EMAIL
        sync: false
      - key: ATLASSIAN_API_TOKEN
        sync: false
      - key: GENERATOR
        value: template
      # The password people sign in with (at least 8 characters). Leave it
      # empty and anyone with the link can use the app.
      - key: APP_PASSWORD
        sync: false
      # Free AI: create a key at console.groq.com and paste it when asked.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Optional: import Azure DevOps work items as requirements. The org URL
      # looks like https://dev.azure.com/your-org; the PAT needs Work Items (Read).
      - key: ADO_ORG_URL
        sync: false
      - key: ADO_PAT
        sync: false
    # The free plan's disk is wiped whenever the service restarts or sleeps
    # (after 15 idle minutes), taking saved test cases with it. To keep them,
    # switch `plan` to starter and uncomment:
    # disk:
    #   name: repository
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add an env var REPOSITORY_PATH=/var/data/repository.json
